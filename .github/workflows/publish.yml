name: Publish to npm

# Pushing a version tag such as ctxbin@1.6.0 publishes that version with npm trusted publishing (OIDC).
# Running the workflow by hand only rehearses the release: the same checks and npm publish --dry-run.
on:
  push:
    tags: ['ctxbin@*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ctxbin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check the release commit and version
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Tag a commit that is already on main."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "ctxbin@$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          echo "ctxbin@$version from $GITHUB_SHA ($GITHUB_REF_NAME)"
      - name: Use npm 11.5.1 or later for trusted publishing
        run: |
          current="$(npm --version)"
          if node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);" "$current"; then
            echo "npm $current"
          else
            npm install -g npm@11
            echo "npm $current -> $(npm --version)"
          fi
      - name: Install pnpm
        run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - name: Check the packed launcher
        run: |
          version="$(node -p "require('./package.json').version")"
          dir="$(mktemp -d)"
          npm pack --pack-destination "$dir"
          printed="$(npx --yes --package="$dir/ctxbin-$version.tgz" ctxbin --version)"
          if [ "$printed" != "$version" ]; then
            echo "::error::Packed ctxbin printed version '$printed', expected $version."
            exit 1
          fi
          npx --yes --package="$dir/ctxbin-$version.tgz" ctxbin help > "$dir/help.md"
          cmp "$dir/help.md" dist/skills/ctxbin/SKILL.md
      - name: Publish
        if: github.event_name == 'push'
        run: npm publish --access public --tag latest
      - name: Rehearse publishing
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run --access public --tag latest
